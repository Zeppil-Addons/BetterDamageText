# Builds the addon zip whenever a version tag is pushed, publishes it as a
# GitHub release, and uploads it to CurseForge.
#   git tag v1.0.3 && git push origin v1.0.3
#
# CurseForge needs a repo secret named CF_API_KEY (an API token from
# https://authors.curseforge.com/account/api-tokens). Without it the upload
# step is skipped and only the GitHub release is made.
#
# The CurseForge changelog is the commit messages since the previous tag, so
# write commit messages players can read.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, for the changelog

      - name: Set the TOC version from the tag
        # block scalar: the ": " inside the sed pattern would break plain YAML
        run: |
          sed -i "s/^## Version: .*/## Version: ${GITHUB_REF_NAME#v}/" BetterDamageText/BetterDamageText.toc

      - name: List bundled fonts
        run: sh tools/update-fonts.sh

      - name: Zip the addon folder
        run: zip -r "BetterDamageText-${GITHUB_REF_NAME}.zip" BetterDamageText

      - name: Write the changelog
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## Better Damage Text ${GITHUB_REF_NAME}"
            echo
            git log --no-merges --format='- %s' ${prev:+"$prev.."}"$GITHUB_REF_NAME"
          } > CHANGELOG.md
          cat CHANGELOG.md

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "BetterDamageText-${GITHUB_REF_NAME}.zip" --title "Better Damage Text ${GITHUB_REF_NAME}" --notes-file CHANGELOG.md

      - name: Upload to CurseForge
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          if [ -z "$CF_API_KEY" ]; then
            echo "::warning::No CF_API_KEY secret, so nothing was uploaded to CurseForge."
            exit 0
          fi
          toc=BetterDamageText/BetterDamageText.toc
          project=$(sed -n 's/^## X-Curse-Project-ID: *\([0-9]*\).*/\1/p' "$toc")

          # The game version comes from the TOC's Interface number:
          # 16001 -> 1.60.1 (X.YY.ZZ), so a client patch only needs a TOC bump.
          interface=$(sed -n 's/^## Interface: *\([0-9]*\).*/\1/p' "$toc")
          version="$((interface / 10000)).$((interface / 100 % 100)).$((interface % 100))"

          api=https://wow.curseforge.com/api
          curl -sf -H "X-Api-Token: $CF_API_KEY" "$api/game/versions" > versions.json
          ids=$(jq -c --arg v "$version" '[.[] | select(.name == $v) | .id]' versions.json)
          if [ "$ids" = "[]" ]; then
            echo "::error::CurseForge has no game version named $version. Versions starting with ${version%.*}:"
            jq -r --arg p "${version%.*}" '.[] | select(.name | startswith($p)) | "\(.id)  \(.name)  type \(.gameVersionTypeID)"' versions.json
            exit 1
          fi
          echo "Game version $version -> CurseForge ids $ids"

          jq -n --rawfile log CHANGELOG.md --argjson ids "$ids" --arg name "Better Damage Text ${GITHUB_REF_NAME}" \
            '{changelog: $log, changelogType: "markdown", displayName: $name, gameVersions: $ids, releaseType: "release"}' > metadata.json

          curl -sS --fail-with-body -H "X-Api-Token: $CF_API_KEY" \
            -F "metadata=<metadata.json" \
            -F "file=@BetterDamageText-${GITHUB_REF_NAME}.zip" \
            "$api/projects/$project/upload-file"
          echo
          echo "Uploaded to CurseForge project $project."
